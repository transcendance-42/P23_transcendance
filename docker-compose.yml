services:
  postgresql:
    image: imresamu/postgis:16-3.4
    container_name: postgresql
    restart: on-failure
    env_file: .env
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - tindog

  backend:
    build: ./backend
    image: backend
    container_name: backend
    restart: on-failure
    env_file: ./backend/.env.docker
    ports:
      - "3000:3000"
    volumes:
      - ./backend:/app
      - ./backend/prisma:/app/prisma
      - ./uploads:/app/uploads
      - backend_node_modules:/app/node_modules
    depends_on:
      postgresql:
          condition: service_healthy
    networks:
      - tindog

  frontend:
    build: ./frontend
    image: frontend
    container_name: frontend
    restart: on-failure
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    depends_on:
      - backend
    networks:
      - tindog

volumes:
  postgres_data:
  frontend_node_modules:
  backend_node_modules:

networks:
  tindog:
    driver: bridge