services: 

  postgresql:
    image: postgres:16
    container_name: postgresql
    restart: on-failure
    env_file: .env
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - tindog

