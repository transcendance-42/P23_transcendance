services:

  postgresql:
    image: postgres:16
    container_name: postgresql
    restart: on-failure
    env_file: .env
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql
      - ./database/migrations:/docker-entrypoint-initdb.d/migrations
    networks:
      - tindog

  backend:
    build: ./backend
    image: backend
    container_name: backend
    restart: on-failure
    env_file: ./backend/.env
    ports:
      - "3000:3000"
    volumes:
      - ./backend/src:/app/src
      - backend_node_modules:/app/node_modules
    depends_on:
      - postgresql
    networks:
      - tindog

  frontend:
    build: ./frontend
    image: frontend
    container_name: frontend
    restart: on-failure
    env_file: .env
    ports:
      - "5173:5173"
    volumes:
      - ./frontend/src:/app/src
      - frontend_node_modules:/app/node_modules
    depends_on:
      - backend
    networks:
      - tindog

volumes:
  postgres_data:
  frontend_node_modules:
  backend_node_modules:

networks:
  tindog:
    driver: bridge
